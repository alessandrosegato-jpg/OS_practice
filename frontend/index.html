<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accorcia — URL shortener su OpenShift</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1d1b18;
      --muted: #6b665d;
      --line: #d9d3c7;
      --card: #fffdf8;
      --accent: #c8341c;
      --accent-ink: #ffffff;
      --ok: #2f6b3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      line-height: 1.5;
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin: 0 0 4px;
    }
    h1 span { color: var(--accent); }
    .lead { color: var(--muted); margin: 0 0 32px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type=url] {
      flex: 1 1 320px;
      font: inherit;
      padding: 14px 16px;
      border: 2px solid var(--ink);
      background: var(--card);
      color: var(--ink);
      border-radius: 0;
    }
    input[type=url]:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
    button {
      font: inherit;
      font-weight: 700;
      padding: 14px 22px;
      border: 2px solid var(--ink);
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      border-radius: 0;
    }
    button:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
    button.ghost { background: var(--card); color: var(--ink); padding: 8px 12px; font-weight: 400; }
    .result {
      margin-top: 20px;
      padding: 16px;
      border: 2px dashed var(--ink);
      background: var(--card);
      display: none;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .result.show { display: flex; }
    .result a { color: var(--accent); font-weight: 700; word-break: break-all; flex: 1 1 auto; }
    .error { color: var(--accent); margin-top: 12px; min-height: 1.5em; }
    h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 1.6rem;
      margin: 48px 0 12px;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .totals { font-family: inherit; font-size: 0.85rem; color: var(--muted); }
    ol { list-style: none; padding: 0; margin: 0; counter-reset: rank; }
    li {
      counter-increment: rank;
      display: grid;
      grid-template-columns: 2.5em 1fr auto;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      align-items: baseline;
    }
    li::before { content: counter(rank, decimal-leading-zero); color: var(--muted); }
    li .code a { color: var(--ink); font-weight: 700; }
    li .url { display: block; color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .clicks { font-weight: 700; }
    .empty { color: var(--muted); padding: 10px 0; }
    footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pod { color: var(--ok); font-weight: 700; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  </style>
</head>
<body>
<main>
  <h1>Accorcia<span>.</span></h1>
  <p class="lead">Link lunghi in, link corti out. Frontend, backend e Redis in tre pod su OpenShift.</p>

  <form id="form">
    <input type="url" id="url" placeholder="https://un-link-molto-lungo.esempio.it/…" required>
    <button type="submit">Accorcia</button>
  </form>
  <div class="error" id="error"></div>
  <div class="result" id="result">
    <a id="short" href="#" target="_blank" rel="noopener"></a>
    <button class="ghost" id="copy" type="button">Copia</button>
  </div>

  <h2>I più cliccati <span class="totals" id="totals"></span></h2>
  <ol id="top"><li class="empty" style="display:block">Caricamento…</li></ol>

  <footer>
    <span><span class="dot"></span>Risposta servita dal pod <span class="pod" id="pod">…</span></span>
    <button class="ghost" id="refresh" type="button">Aggiorna</button>
  </footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const shortUrl = (code) => `${location.origin}/r/${code}`;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadStats() {
    try {
      const res = await fetch('/api/stats');
      const data = await res.json();
      $('pod').textContent = data.pod;
      $('totals').textContent = `${data.links_total} link · ${data.clicks_total} click`;
      const top = $('top');
      if (!data.top.length) {
        top.innerHTML = '<li class="empty" style="display:block">Nessun link ancora. Crea il primo!</li>';
        return;
      }
      top.innerHTML = data.top.map(l => `
        <li>
          <span>
            <span class="code"><a href="/r/${escapeHtml(l.code)}" target="_blank" rel="noopener">/r/${escapeHtml(l.code)}</a></span>
            <span class="url">${escapeHtml(l.url || '')}</span>
          </span>
          <span class="clicks">${l.clicks}</span>
        </li>`).join('');
    } catch (e) {
      $('pod').textContent = 'non raggiungibile';
    }
  }

  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('error').textContent = '';
    $('result').classList.remove('show');
    try {
      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: $('url').value})
      });
      const data = await res.json();
      if (!res.ok) { $('error').textContent = data.error || 'Errore'; return; }
      const link = shortUrl(data.code);
      $('short').href = link;
      $('short').textContent = link;
      $('result').classList.add('show');
      $('pod').textContent = data.pod;
      $('url').value = '';
      loadStats();
    } catch (e) {
      $('error').textContent = 'Backend non raggiungibile';
    }
  });

  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('short').textContent); $('copy').textContent = 'Copiato!'; }
    catch (e) { $('copy').textContent = 'Copia a mano'; }
    setTimeout(() => $('copy').textContent = 'Copia', 1500);
  });

  $('refresh').addEventListener('click', loadStats);
  loadStats();
</script>
</body>
</html>
